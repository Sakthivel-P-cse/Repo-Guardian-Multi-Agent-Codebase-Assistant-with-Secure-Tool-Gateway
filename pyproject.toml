[project]
name = "repo-guardian"
version = "0.1.0"
description = "Multi-agent codebase assistant with a secure tool gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "anthropic>=0.49.0",
    "fastapi>=0.115.0",
    "mcp>=1.8.0",
    "pydantic-settings>=2.7.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
repo-guardian-demo = "repo_guardian.entrypoints.run_demo:main"
repo-guardian-mcp = "repo_guardian.entrypoints.serve_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_guardian"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
